[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click",
    "rich",
    "cryptography",
    "requests",
    "pyyaml",
    "fastapi>=0.136",
    "uvicorn>=0.48",
    "starlette>=1.1",
    "pydantic>=2.13",
    "redis>=7.4",
    "qdrant-client>=1.18",
    "openai>=2.41",
    "anthropic>=0.107",
    "google-genai>=2.8",
    "model2vec>=0.8",
    "numpy>=2.4",
    "httpx",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx",
    "fakeredis>=2.38",
]

[project.scripts]
tollgate = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/app/intelligence/*",
]
